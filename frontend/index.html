<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) resolves to
         0 and the mobile dock/toast sit under the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Databender Draft Daddy — Fantasy Draft Analytics</title>
    <meta
      name="description"
      content="Draft your fantasy football team with value-over-replacement analytics: live ESPN sync, tier alerts, and a suggested pick for every turn."
    />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Databender" />
    <meta property="og:title" content="Databender Draft Daddy" />
    <meta
      property="og:description"
      content="A free fantasy football draft board built on value-over-replacement analytics — live ESPN sync, tiers, floor/ceiling, and a suggested pick for every turn."
    />
    <meta property="og:url" content="https://draftdaddy.databender.co/" />
    <meta property="og:image" content="https://draftdaddy.databender.co/images/og-draftdaddy.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Databender Draft Daddy" />
    <meta name="twitter:image" content="https://draftdaddy.databender.co/images/og-draftdaddy.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Pre-paint theme resolution: no flash of the wrong theme on first load.
         localStorage "ffdraft:v1:theme" = "light"|"dark" when the user chose
         explicitly; absent means follow the OS (lib/theme.ts keeps following it
         live while absent). <html data-theme> is always the RESOLVED theme. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('ffdraft:v1:theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (err) {
          /* private mode / storage blocked: fall through to the OS check */
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          } catch (err2) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0d0d' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
